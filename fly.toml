# Fly.io: the alternative when you want practice portfolios to survive a restart, since a
# volume is available on the free allowance.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create fincortext_data --size 1 --region sin
#   fly secrets set UPSTOX_ACCESS_TOKEN=...
#   fly deploy
#
# Change `app` to your own name before deploying.

app = "fincortext"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DUCKDB_PATH = "/data/fincortext.duckdb"
  LIVE_MODE = "stream"
  NEWS_ENABLED = "true"
  LLM_PROVIDER = "none"
  PORT = "8000"

[[mounts]]
  source = "fincortext_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # The live price feed is a WebSocket, so keep one machine awake rather than scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
