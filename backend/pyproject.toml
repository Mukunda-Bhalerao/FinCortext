[project]
name = "fincortext-backend"
version = "0.1.0"
description = "FinCortext research platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "duckdb>=1.1",
    "pytz>=2024.1",  # required by duckdb to return TIMESTAMPTZ values
    "websockets>=13.0",
    "protobuf>=7.35",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Only needed to regenerate app/providers/upstox_proto from MarketDataFeed.proto
proto = ["grpcio-tools>=1.84"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/providers/upstox_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
